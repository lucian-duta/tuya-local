name: Radiator
products:
  - id: sywxb97bdezpzn5k
    manufacturer: Beldray
entities:
  - entity: climate
    translation_only_key: heater
    dps:
      - id: 1
        name: hvac_mode
        type: boolean
        mapping:
          - dps_val: true
            value: heat
          - dps_val: false
            value: "off"
      - id: 2
        name: preset_mode
        type: string
        mapping:
          - dps_val: hot
            value: comfort
          - dps_val: eco
            value: eco
          - dps_val: cold
            value: anti_frost
          - dps_val: program
            value: program
          - dps_val: induce
            value: induce
          - dps_val: wire
            value: wire
      - id: 16
        name: temperature
        type: integer
        unit: C
        range:
          min: 70
          max: 300
        mapping:
          - scale: 10
            step: 5
      - id: 24
        name: current_temperature
        type: integer
        unit: C
        mapping:
          - scale: 10
  - entity: number
    translation_key: temperature_calibration
    class: temperature_delta
    category: config
    dps:
      - id: 27
        type: integer
        name: value
        unit: C
        range:
          min: -5
          max: 5
  - entity: lock
    translation_key: child_lock
    category: config
    dps:
      - id: 40
        type: boolean
        name: lock
  - entity: select
    name: Induce time
    icon: "mdi:timer-outline"
    category: config
    dps:
      - id: 101
        type: string
        name: option
        mapping:
          - dps_val: "15"
            value: "15 min"
          - dps_val: "30"
            value: "30 min"
          - dps_val: "45"
            value: "45 min"
          - dps_val: "60"
            value: "60 min"
  - entity: select
    name: Anti-scald limit
    icon: "mdi:thermometer-alert"
    category: config
    dps:
      - id: 102
        type: string
        name: option
        mapping:
          - dps_val: "0"
            value: "Off"
          - dps_val: "30"
            value: "30°C"
          - dps_val: "35"
            value: "35°C"
          - dps_val: "40"
            value: "40°C"
          - dps_val: "45"
            value: "45°C"
          - dps_val: "50"
            value: "50°C"
  - entity: select
    name: Open window detection
    icon: "mdi:window-open-variant"
    category: config
    dps:
      - id: 103
        type: string
        name: option
        mapping:
          - dps_val: "0"
            value: "Off"
          - dps_val: "60"
            value: "60 min"
          - dps_val: "90"
            value: "90 min"
  - entity: switch
    name: Wired control
    icon: "mdi:cable-data"
    category: config
    dps:
      - id: 104
        type: boolean
        name: switch
